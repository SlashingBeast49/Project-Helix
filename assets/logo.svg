<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      .node { fill: #006666; }
      .edge { stroke: #006666; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .text-project { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 32px; font-weight: 300; fill: #006666; letter-spacing: 6px; }
      .text-helix { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 32px; font-weight: 800; fill: #006666; letter-spacing: 6px; }
    </style>
  </defs>

  <!-- Left Strand Edges -->
  <line x1="280" y1="120" x2="330" y2="180" class="edge" />
  <line x1="280" y1="120" x2="280" y2="240" class="edge" />
  <line x1="330" y1="180" x2="280" y2="240" class="edge" />
  <line x1="280" y1="240" x2="350" y2="200" class="edge" />
  <line x1="330" y1="180" x2="350" y2="200" class="edge" />
  
  <line x1="280" y1="240" x2="330" y2="300" class="edge" />
  <line x1="330" y1="300" x2="280" y2="360" class="edge" />
  <line x1="280" y1="360" x2="350" y2="420" class="edge" />
  <line x1="280" y1="360" x2="280" y2="480" class="edge" />
  <line x1="350" y1="420" x2="280" y2="480" class="edge" />
  <line x1="330" y1="300" x2="350" y2="420" class="edge" />

  <!-- Right Strand Edges -->
  <line x1="520" y1="120" x2="470" y2="180" class="edge" />
  <line x1="520" y1="120" x2="520" y2="240" class="edge" />
  <line x1="470" y1="180" x2="520" y2="240" class="edge" />
  <line x1="520" y1="240" x2="450" y2="200" class="edge" />
  <line x1="470" y1="180" x2="450" y2="200" class="edge" />

  <line x1="520" y1="240" x2="470" y2="300" class="edge" />
  <line x1="470" y1="300" x2="520" y2="360" class="edge" />
  <line x1="520" y1="360" x2="450" y2="420" class="edge" />
  <line x1="520" y1="360" x2="520" y2="480" class="edge" />
  <line x1="450" y1="420" x2="520" y2="480" class="edge" />
  <line x1="470" y1="300" x2="450" y2="420" class="edge" />

  <!-- Cross Connection (H Bridge) -->
  <line x1="330" y1="300" x2="470" y2="300" class="edge" />

  <!-- Left Strand Nodes -->
  <circle cx="280" cy="120" r="16" class="node" />
  <circle cx="330" cy="180" r="16" class="node" />
  <circle cx="280" cy="240" r="16" class="node" />
  <circle cx="350" cy="200" r="16" class="node" />
  
  <circle cx="330" cy="300" r="16" class="node" />
  
  <circle cx="280" cy="360" r="16" class="node" />
  <circle cx="350" cy="420" r="16" class="node" />
  <circle cx="280" cy="480" r="16" class="node" />

  <!-- Right Strand Nodes -->
  <circle cx="520" cy="120" r="16" class="node" />
  <circle cx="470" cy="180" r="16" class="node" />
  <circle cx="520" cy="240" r="16" class="node" />
  <circle cx="450" cy="200" r="16" class="node" />
  
  <circle cx="470" cy="300" r="16" class="node" />
  
  <circle cx="520" cy="360" r="16" class="node" />
  <circle cx="450" cy="420" r="16" class="node" />
  <circle cx="520" cy="480" r="16" class="node" />

  <!-- Typography -->
  <g transform="translate(400, 550)">
    <text text-anchor="end" x="-10" y="0" class="text-project">PROJECT</text>
    <text text-anchor="start" x="10" y="0" class="text-helix">HELIX</text>
  </g>
</svg>
